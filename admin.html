<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم ApexDev</title>
    <link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>
    <div class="admin-container">
        <h1>لوحة التحكم - الطلبات الواردة 🔥</h1>
        <a href="index.html" style="color: var(--main-color); text-decoration: none;">← العودة للموقع</a>
        
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>العميل</th>
                    <th>الخدمة</th>
                    <th>التفاصيل</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>

    <script>
        // نضع نفس الكونفيج هنا أيضاً
const firebaseConfig = {
    apiKey: "AIzaSyDmVHTi4xD8ScPYqm5PQ_o4Gmti9dWiIsQ",
    authDomain: "://firebaseapp.com",
    projectId: "apexdev-abdd9",
    databaseURL: "https://firebaseio.com"
};

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('orders').on('value', (snapshot) => {
            const data = snapshot.val();
            const body = document.getElementById('ordersBody');
            body.innerHTML = '';
            for (let id in data) {
                const order = data[id];
                body.innerHTML += `
                    <tr>
                        <td>${order.date}</td>
                        <td>${order.name}</td>
                        <td>${order.service}</td>
                        <td>${order.details}</td>
                        <td><button class="delete-btn" onclick="deleteOrder('${id}')">حذف</button></td>
                    </tr>`;
            }
        });

        function deleteOrder(id) {
            if(confirm('حذف الطلب؟')) database.ref('orders/' + id).remove();
        }
    </script>
</body>
</html>
