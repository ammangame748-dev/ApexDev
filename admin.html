<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم ApexDev</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #111827, #0b1220, #1e293b);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: #fff;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .admin-container {
            width: 90%;
            max-width: 1100px;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin-bottom: 15px;
            font-size: 28px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        a {
            display: inline-block;
            margin-bottom: 20px;
            color: #38bdf8;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: #0ea5e9;
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        tr {
            transition: 0.3s;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.01);
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #dc2626;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h1> لوحة التحكم - الطلبات الواردة </h1>
        <a href="index.html">← العودة للموقع</a>

        <table>
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>العميل</th>
                    <th>ايدي ديسكورد</th>
                    <th>الخدمة</th>
                    <th>التفاصيل</th>
                    <th>السعر</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDmVHTi4xD8ScPYqm5PQ_o4Gmti9dWiIsQ",
            authDomain: "apexdev-abdd9.firebaseapp.com",
            databaseURL: "https://apexdev-abdd9-default-rtdb.firebaseio.com",
            projectId: "apexdev-abdd9",
            storageBucket: "apexdev-abdd9.firebasestorage.app",
            messagingSenderId: "46524918249",
            appId: "1:46524918249:web:b3fd61fcddec3b41b20378"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('orders').on('value', (snapshot) => {
            const data = snapshot.val();
            const body = document.getElementById('ordersBody');
            body.innerHTML = '';

            for (let id in data) {
                const order = data[id];

                body.innerHTML += `
                    <tr>
                        <td>${order.date}</td>
                        <td>${order.name}</td>
                        <td>${order.discordID || 'N/A'}</td>
                        <td>${order.service}</td>
                        <td>${order.details}</td>
                        <td>${order.price || '0$'}</td>
                        <td><button onclick="deleteOrder('${id}')">حذف</button></td>
                    </tr>
                `;
            }
        });

        function deleteOrder(id) {
            if (confirm('هل تريد حذف الطلب؟')) {
                database.ref('orders/' + id).remove();
            }
        }
    </script>

</body>

</html>
