<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | ApexDev Admin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* تنسيقات إضافية خاصة بجدول الطلبات */
        .admin-container { padding: 50px 10%; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #1a1a1a; color: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; border: 1px solid #333; text-align: center; }
        th { background: var(--main-color); color: black; font-weight: bold; }
        tr:hover { background: #222; }
        .delete-btn { background: #ff0000; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .delete-btn:hover { background: #b30000; box-shadow: 0 0 10px #ff0000; }
        .no-orders { padding: 20px; font-size: 1.2rem; color: #888; }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Apex<span>Admin</span> Panel</div>
            <ul>
                <li><a href="index.html">العودة للموقع</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-container">
        <h1>إدارة الطلبات القادمة 🔥</h1>
        
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>اسم العميل</th>
                    <th>نوع الخدمة</th>
                    <th>التفاصيل</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="ordersBody">
                <!-- هنا ستظهر الطلبات تلقائياً -->
            </tbody>
        </table>
        <div id="noOrdersMessage" class="no-orders" style="display: none;">لا يوجد طلبات حالياً..</div>
    </div>

    <script>
        // دالة لعرض الطلبات
        function displayOrders() {
            const ordersBody = document.getElementById('ordersBody');
            const noOrdersMessage = document.getElementById('noOrdersMessage');
            const orders = JSON.parse(localStorage.getItem('apexOrders')) || [];

            ordersBody.innerHTML = '';

            if (orders.length === 0) {
                noOrdersMessage.style.display = 'block';
                return;
            }

            noOrdersMessage.style.display = 'none';

            orders.forEach((order, index) => {
                const row = `
                    <tr>
                        <td>${order.date}</td>
                        <td>${order.name}</td>
                        <td>${order.service === 'website' ? 'برمجة موقع' : 'بوت ديسكورد'}</td>
                        <td>${order.details}</td>
                        <td><button class="delete-btn" onclick="deleteOrder(${index})">حذف</button></td>
                    </tr>
                `;
                ordersBody.innerHTML += row;
            });
        }

        // دالة لحذف طلب
        function deleteOrder(index) {
            let orders = JSON.parse(localStorage.getItem('apexOrders')) || [];
            orders.splice(index, 1);
            localStorage.setItem('apexOrders', JSON.stringify(orders));
            displayOrders(); // تحديث الجدول
        }

        // تشغيل الدالة عند تحميل الصفحة
        window.onload = displayOrders;
    </script>
</body>
</html>
